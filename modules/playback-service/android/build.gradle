plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playbackservice'
version = '1.0.0'

android {
  namespace "expo.modules.playbackservice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.media:media:1.7.0'
  implementation 'androidx.core:core-ktx:1.15.0'
}
